<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통나무 팬션</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/ajax/booking.css">
</head>
<body>
    <div id="wrap">
        <header class="d-flex justify-content-center align-items-center">
            <a href="/ajax/booking/main" class="display-4 nav-link text-dark">통나무 팬션</a>
        </header>
        
        <nav class="main-menu">
            <ul class="nav nav-fill font-weight-bold">
                <li class="nav-item"><a href="#" class="nav-link text-white">팬션소개</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">객실보기</a></li>
                <li class="nav-item"><a href="/ajax/booking/input" class="nav-link text-white">예약하기</a></li>
                <li class="nav-item"><a href="/ajax/booking/list" class="nav-link text-white">예약목록</a></li>
            </ul>
        </nav>
        
        <section class="d-flex justify-content-center">
            <div class="col-6 my-5">
	            <h2 class="text-center my-4">예약 하기</h2>
	            	
	            <label>이름</label>
				<input type="text" class="form-control" id="nameInput">
				<label class="mt-3">예약날짜</label>
				<input type="date" class="form-control" id="dateInput">
				<label class="mt-3">숙박일수</label>
				<input type="text" class="form-control" id="dayInput">
				<label class="mt-3">숙박인원</label>
				<input type="text" class="form-control" id="headcountInput">
				<label class="mt-3">전화번호</label>
				<input type="text" class="form-control" id="phoneNumberInput">
				<button type="button" class="btn btn-warning btn-block mt-3" id="addBtn">예약하기</button>
            </div>
        </section>
        
        <footer class="mt-3">
            <div class="small text-secondary">
                제주특별자치도 제주시 애월읍  <br>
                사업자등록번호 : 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목 <br>
                Copyright 2025 tongnamu All right reserved
            </div>
        </footer>
    </div>
    
    <script
  src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
  crossorigin="anonymous"></script>
	<script>
		$(document).ready(function() {
			
			$("#addBtn").on("click", function() {
							
				let name = $("#nameInput").val();
				let date = $("#dateInput").val();
				let day = $("#dayInput").val();
				let headcount = $("#headcountInput").val();
				let phoneNumber = $("#phoneNumberInput").val();
				
				// 유효성 검사 
				if(name == "") {
					alert("이름을 입력하세요");
					return ;
				}
				
				if(date == "") {
					alert("예약날짜를 입력하세요");
					return ;
				}
				
				if(isNaN(day)) {
	    			alert("숙박일수는 숫자만 입력 가능합니다");
	    			return ;
	    		}
				
				if(day == "") {
					alert("숙박일수를 입력하세요");
					return ;
				}
				
				if(isNaN(headcount)) {
	    			alert("숙박인원은 숫자만 입력 가능합니다");
	    			return ;
	    		}
				
				if(headcount == "") {
					alert("숙박인원을 입력하세요");
					return ;
				}
				
				if(phoneNumber == "") {
					alert("전화번호를 입력하세요");
					return ;
				}
				
				$.ajax({
					type:"post"
					, url:"/ajax/booking/create"
					, data:{"name":name, "date":date, "day":day, "headcount":headcount, "phoneNumber":phoneNumber}
					, success:function(response) {
						// 성공 : {"result":"success"}
						// 실패 : {"result":"fail"}
						if(response.result == "success") {
							// 리스트 페이지로 이동
							location.href = "/ajax/booking/list";
						} else {
							alert("추가 실패");	
						}
						
					}
					, error:function() {
						alert("추가 에러");
					}
				});
			});
			
		});
	</script>
	
</body>
</html>
