<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통나무 팬션</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/ajax/booking.css">
</head>
<body>
    <div id="wrap">
        <header class="d-flex justify-content-center align-items-center">
            <a href="/ajax/booking/main" class="display-4 nav-link text-dark">통나무 팬션</a>
        </header>
        
        <nav class="main-menu">
            <ul class="nav nav-fill font-weight-bold">
                <li class="nav-item"><a href="#" class="nav-link text-white">팬션소개</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">객실보기</a></li>
                <li class="nav-item"><a href="/ajax/booking/input" class="nav-link text-white">예약하기</a></li>
                <li class="nav-item"><a href="/ajax/booking/list" class="nav-link text-white">예약목록</a></li>
            </ul>
        </nav>
        
        <section class="contents">
            <div>
            	<h2 class="text-center my-4">예약 목록 보기</h2>
				<table class="table text-center">
					<thead>
						<tr>
							<th>이름</th>
							<th>예약날짜</th>
							<th>숙박일수</th>
							<th>숙박인원</th>
							<th>전화번호</th>
							<th>예약상태</th>
							<th></th>
						</tr>
					</thead>
					
					<tbody>
						
						<tr th:each="booking : ${bookingList}">
							<td th:text="${booking.name}"></td>
							<td th:text="${#temporals.format(booking.date, 'yyyy년 M월 d일')}"></td>
							<td th:text="${booking.day}"></td>
							<td th:text="${booking.headcount}"></td>
							<td th:text="${booking.phoneNumber}"></td>
							<td th:switch="${booking.state}">
	             				<span class="text-info" th:case="대기중">대기중</span>
	             				<span class="text-success" th:case="확정">확정</span>
	             				<span class="text-danger" th:case="취소">취소</span>
	             				<span th:case="*" th:text="${booking.state}"></span>
	             			</td>
							<td><button type="button" th:value="${booking.id}" class="btn btn-danger delete-btn">삭제</button></td>
						</tr>

					</tbody>
				
				</table>
            </div>
        </section>
        
        <footer class="mt-3">
            <div class="small text-secondary">
                제주특별자치도 제주시 애월읍  <br>
                사업자등록번호 : 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목 <br>
                Copyright 2025 tongnamu All right reserved
            </div>
        </footer>
        
        <script
  src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
  crossorigin="anonymous"></script>
	<script>
		$(document).ready(function() {
			
			$(".delete-btn").on("click", function() {
				
				let bookingId = $(this).val();
				
				$.ajax({
					type:"get"
					, url:"/ajax/booking/delete"
					, data:{"id":bookingId}
					, success:function(response) {
						// 성공 : {"result":"success"}
						// 실패 : {"result":"fail"}
						if(response.result == "success") {
							// 새로고침
							location.reload();
						} else {
							alert("삭제 실패");
						}
						
					}
					, error:function() {
						alert("삭제 에러");
					}
				});
			});
		});
	</script>
    </div>
    
</body>
</html>
