<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>즐겨찾기 추가하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
	<div class="container">
		<h2>즐겨찾기 추가하기</h2>
		
		<label class="mt-3">제목</label>
		<input type="text" class="form-control" id="titleInput">
		<label class="mt-3">주소</label>
		<div class="d-flex">
			<input type="text" class="form-control mr-3" id="urlInput">
			<button type="button" class="btn btn-info col-2" id="duplicate-url">중복 확인</button>
		</div>
		<div class="text-danger small d-none" id="duplicateText">중복된 url입니다</div>
		<div class="text-success small d-none" id="availableText">저장 가능한 url입니다</div>
		<button type="button" class="btn btn-success btn-block mt-3" id="addBtn">추가</button>
	</div>
	
	<script
  src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
  crossorigin="anonymous"></script>
	<script>
		$(document).ready(function() {
			
			$("#duplicate-url").on("click", function() {
				
				let url = $("#urlInput").val();
				
				if(url == "") {
					alert("주소를 입력하세요");
					return ;
				}
				
				// 주소가 http:// 로 시작하지 않고 https:// 로 시작하지 않으면 
				if(!url.startsWith("http://") && !url.startsWith("https://")) {
					alert("주소형식을 확인해 주세요");
					return ;
				}
				
				$.ajax({
					type:"post"
					, url:"/ajax/favorite/duplicate-url"
					, data:{"url":url}
					, success:function(response) {
						// 중복 : {"isDuplicate":true}
						// 중복 아님 : {"isDuplicate":false}
						if(response.isDuplicate) {
							$("#duplicateText").removeClass("d-none");
							$("#availableText").addClass("d-none");
						} else {
							$("#availableText").removeClass("d-none");
							$("#duplicateText").addClass("d-none");
						}
						
					}
					, error:function() {
						alert("추가 에러");
					}
				});
				
			});
			
			$("#addBtn").on("click", function() {
				
				let title = $("#titleInput").val();
				let url = $("#urlInput").val();
				
				// 유효성 검사 
				if(title == "") {
					alert("제목을 입력하세요");
					return ;
				}
				
				if(url == "") {
					alert("주소를 입력하세요");
					return ;
				}
				
				// 주소가 http:// 로 시작하지 않고 https:// 로 시작하지 않으면 
				if(!url.startsWith("http://") && !url.startsWith("https://")) {
					alert("주소형식을 확인해 주세요");
					return ;
				}
				
				$.ajax({
					type:"post"
					, url:"/ajax/favorite/create"
					, data:{"name":title, "url":url}
					, success:function(response) {
						// 성공 : {"result":"success"}
						// 실패 : {"result":"fail"}
						if(response.result == "success") {
							// 리스트 페이지로 이동
							location.href = "/ajax/favorite/list";
						} else {
							alert("추가 실패");	
						}
						
					}
					, error:function() {
						alert("추가 에러");
					}
				});
			});
		});
	</script>
</body>
</html>
