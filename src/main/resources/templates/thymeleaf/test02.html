<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Thymeleaf 반복문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
	<!-- 1. 반복문 -->
	<div class="container">
		<h1>HOT 5</h1>
		<table class="table text-center">
			<thead>
				<tr>
					<th>순위</th>
					<th>제목</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="music, status : ${musicRanking}">
					<td th:text="${status.count}">1</td>
					<td th:text="${music}">강남스타일</td>
				</tr>
			</tbody>
		</table>
	</div>
	
	<!-- 2. 반복문과 조건 -->
	<div class="container">
		<h1>멤버십</h1>
		<table class="table text-center">
			<thead>
				<tr>
					<th>이름</th>
					<th>전화번호</th>
					<th>등급</th>
					<th>포인트</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="member : ${membership}">
					<td th:text="${member.name}">손오공</td>
					<td th:text="${member.phoneNumber}">010-1234-5678</td>
					<td th:switch="${member.grade}">
						<span th:case="VIP" class="text-danger">VIP</span>
						<span th:case="GOLD" class="text-warning">GOLD</span>
						<span th:case="BASIC">BASIC</span>
					</td>
					<td th:if="${member.point >= 5000}" th:text="${member.point}" class="text-primary">12040P</td>
					<td th:unless="${member.point >= 5000}" th:text="${member.point}">12040P</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
