<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>리뷰 페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/thymeleaf/storeReviewStyle.css">
</head>
<body>
	<div id="wrap">
		<header class="d-flex align-items-center pl-4 bg-info">
			<h2 class="text-white">배탈의 민족</h2>
		</header>
		
		<section class="main-items">
			<div class="display-4 mt-2" th:text="|${storeName} - 리뷰|"> </div>
            
           	<div th:if="${#lists.isEmpty(reviewList)}" class="m-5">
           		<h1>작성된 리뷰가 없습니다.</h1>
           	</div>
           	
           	
			<div th:each="review:${reviewList}" class="border border-info rounded mt-3 p-3">
                <div class="d-flex">
                    <div class="font-weight-bold" th:text="${review.userName}">사용자</div>
                    <div class="ml-2">
                   		<img th:each="i:${#numbers.sequence(1, review.point)}"  
                        	src="http://marondal.com/material/images/dulumary/web/jstl/star_fill.png" width="15">
                    	<img th:if="${review.point % 1 != 0}" 
                    		src="http://marondal.com/material/images/dulumary/web/jstl/star_half.png" width="15">
                    	<img th:each="i:${#numbers.sequence(1, 5 - review.point, 1)}" 
                        	src="http://marondal.com/material/images/dulumary/web/jstl/star_empty.png" width="15">
                    </div>
                </div>
                <div class="text-secondary small" th:text="${#temporals.format(review.createdAt, 'yyyy년 M월 d일')}">2028년 5월 3일</div>
                <div class="mt-2 mb-2" th:text="${review.review}">맛있어요!</div>
                <span class="menu small p-1 rounded" th:text="${review.menu}">냉면</span>
            </div>
		</section>
		
		<hr>
		
		<footer class="pl-3">
			<div class="first-text font-weight-bold mb-1">(주)우와한형제</div>
			<div class="second-text">고객센터 : 1500-1500</div>
		</footer>
	</div>
</body>
</html>
