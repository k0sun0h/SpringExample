<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>우리동네 가게 리스트 페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/thymeleaf/storeReviewStyle.css">
</head>
<body>
	<div id="wrap">
		<header class="d-flex align-items-center pl-4 bg-info">
			<h2 class="text-white">배탈의 민족</h2>
		</header>
		
		<section class="main-items">
			<div class="display-4">우리동네 가게</div>
			<div th:each="store:${storeList}">
	            <a th:href="|/thymeleaf/store/review?storeId=${store.id }&storeName=${store.name}|" class="store-link">
	                <div class="border border-info rounded mt-3 p-3 text-dark">
	                    <h4 th:text="${store.name}">홍콩반점</h4>
	                    <div th:text="|전화 번호 : ${store.phoneNumber}|">02-5555-8888</div>
	                    <div th:text="|주소 : ${store.address}|">서울시 서초구 </div>
	                </div>
	            </a>
            </div>
		</section>
		
		<hr>
		
		<footer class="pl-3">
			<div class="first-text font-weight-bold mb-1">(주)우와한형제</div>
			<div class="second-text">고객센터 : 1500-1500</div>
		</footer>
	</div>
</body>
</html>
