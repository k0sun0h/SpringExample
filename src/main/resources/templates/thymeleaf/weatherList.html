<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>날씨 정보 페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/thymeleaf/style.css">
</head>
<body>
	<div id="wrap">
		<section class="contents d-flex">
			<nav class="main-menu pt-3">
                <img src="/thymeleaf/Logo.png" width="100px" height="40px" class="d-block mx-auto" alt="기상청 로고">
                <ul class="nav flex-column font-weight-bold mt-4">
                    <li class="nav-item"><a href="/thymeleaf/weather/list" class="nav-link text-white">날씨</a></li>
                    <li class="nav-item"><a href="/thymeleaf/weather/input" class="nav-link text-white">날씨입력</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">테마날씨</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">관측 기후</a></li>
                </ul>
            </nav>
            <article class="main-list p-4">
                <h3>과거 날씨</h3>
                <table class="table text-center">
					<thead>
						<tr>
							<th>날짜</th>
							<th>날씨</th>
							<th>기온</th>
							<th>강수량</th>
							<th>미세먼지</th>
							<th>풍속</th>
						</tr>
					</thead>
					<tbody>
						
						<!-- 서버에서 전달된 weatherList라는 리스트를 순회하며 각 weather 객체를 행으로 출력 -->
						<tr th:each="weather:${weatherList}">
							<td th:text="${#temporals.format(weather.date, 'yyyy년 M월 d일')}" >2024년 5월 12일 </td>
							<td th:switch="${weather.weather}">
								<img th:case="맑음" src="http://marondal.com/material/images/dulumary/web/jstl/sunny.jpg">
								<img th:case="구름조금" src="http://marondal.com/material/images/dulumary/web/jstl/partlyCloudy.jpg">
								<img th:case="흐림" src="http://marondal.com/material/images/dulumary/web/jstl/cloudy.jpg">
								<img th:case="비" src="http://marondal.com/material/images/dulumary/web/jstl/rainy.jpg">
								<!-- 지정된 상태 외에는 텍스트로 직접 출력 -->
								<span th:case="*" th:text="${weather.weather}"></span>		
							</td>
							<td th:text="|${weather.temperatures}°C|">25.8°C</td>
							<td th:text="|${weather.precipitation }mm|">25.3mm</td>
							<td th:text="|${weather.microDust }|">좋음</td>
							<td th:text="|${weather.windSpeed }km/h|">5.3km/h</td>
						</tr>
					</tbody>
				
				</table>
            </article>
		</section>
		<footer class="d-flex">
			<img src="/thymeleaf/Logo.png" width="130px" height="60px" alt="기상청 로고">
            <div class="footer-text text-dark">
                <div>(07062) 서울시 동작구 여의대방로16길 61</div>
                <div>Copyright@2020 KMA. All Rights RESERVED.</div>
            </div>
		</footer>
	</div>
</body>
</html>
