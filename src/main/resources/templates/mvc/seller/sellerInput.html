<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>판매자 추가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

	<div class="container">
	
		<h2 class="mt-3">판매자 추가</h2>
		<form method="post" action="/mvc/seller/create">
			<label class="mt-3">닉네임</label>
			<input type="text" class="form-control col-3" name="nickname">
			<label class="mt-3">프로필 사진 url</label>
			<input type="text" class="form-control col-6" name="profileImage">
			<label class="mt-3">온도</label>
			<input type="text" class="form-control col-3" name="temperature">
			
			<button type="submit" class="btn btn-primary mt-3">추가</button>
		</form>
	
	</div>

</body>
</html>
