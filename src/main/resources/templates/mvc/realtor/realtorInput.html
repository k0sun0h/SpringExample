<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>공인중개사 추가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
	
	<div class="container">
		<h1>공인중개사 추가</h1>
	
		<form method="post" action="/mvc/realtor/create">
			<label>상호명</label> <input type="text" class="form-control col-8" name="office"> <br>
			<label>전화번호</label> <input type="text" class="form-control col-8" name="phoneNumber"> <br>
			<label>주소</label> <input type="text" class="form-control col-8" name="address"> <br>
			<label>등급</label> <input type="text" class="form-control col-8" name="grade" placeholder="안심중개사, 일반중개사, 프리미엄중개사"> <br>
			<button type="submit" class="btn btn-primary">추가</button>
		</form>	
	</div>

</body>
</html>
